.iso{

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;

}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1040px,100% - 32px);margin:64px auto 96px}

.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}

// Golf ball flight, bounce and roll on the course. Plain script: defines makeGolf(course); shared by the page and the Node test.
function makeGolf(course) {
  const G = 9.81, RHO = 1.2, MASS = 0.04593, R = 0.02135, AREA = Math.PI * R * R;
  const CUP = 0.054;
  // ball speed (m/s), launch angle (deg), backspin (rpm) for a full swing
  const CLUBS = {
    driver: { name: "Driver", speed: 67.5, launch: 11, spin: 2600 },
    i7: { name: "7-iron", speed: 51.5, launch: 17, spin: 7000 },
    i9: { name: "9-iron", speed: 45.5, launch: 21, spin: 8400 },
    pw: { name: "Pitching wedge", speed: 40.5, launch: 25, spin: 9200 },
    putter: { name: "Putter", putt: true },
  };
  // restitution, share of horizontal speed kept on a bounce, rolling deceleration (m/s²)
  const SURF = {
    tee: { e: 0.36, keep: 0.72, roll: 1.4, name: "tee" },
    fairway: { e: 0.36, keep: 0.72, roll: 1.4, name: "fairway" },
    green: { e: 0.28, keep: 0.62, roll: 0.55, name: "green" },
    fringe: { e: 0.3, keep: 0.66, roll: 0.9, name: "fringe" },
    rough: { e: 0.22, keep: 0.5, roll: 3.2, name: "rough" },
    sand: { e: 0.06, keep: 0.12, roll: 9.0, name: "bunker" },
    water: { name: "water" },
    ob: { name: "out of bounds" },
  };
  const inPoly = (x, y, p) => {
    let c = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      const [xi, yi] = p[i], [xj, yj] = p[j];
      if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
    }
    return c;
  };
  function surfaceAt(x, y) {
    if (!inPoly(x, y, course.outline)) return "ob";
    if (course.water.some((p) => inPoly(x, y, p))) return "water";
    if (course.sand.some((p) => inPoly(x, y, p))) return "sand";
    if (inPoly(x, y, course.green)) return "green";
    if (course.fringe && inPoly(x, y, course.fringe)) return "fringe";
    if (inPoly(x, y, course.tee)) return "tee";
    if (course.fairway.some((p) => inPoly(x, y, p))) return "fairway";
    return "rough";
  }
  // a tree is a trunk and a cone of branches; returns true if the point is inside
  function treeAt(x, y, z) {
    for (const t of course.trees) {
      const d = Math.hypot(x - t.x, y - t.y);
      if (z < 0 || z > t.h) continue;
      if (z < t.trunk) { if (d < t.trunkR + R) return t; continue; }
      const r = t.r * (1 - (z - t.trunk) / (t.h - t.trunk));
      if (d < r) return t;
    }
    return null;
  }
  const lieOf = (x, y) => SURF[surfaceAt(x, y)].name;

  // aim: heading in radians on the ground (0 = +x, increasing toward +y)
  function shot(start, clubKey, power, heading) {
    const club = CLUBS[clubKey];
    const ux = Math.cos(heading), uy = Math.sin(heading);
    const out = { samples: [], marks: [], club: club.name };
    let x = start.x, y = start.y, z = 0, t = 0;
    let vx, vy, vz, spin, phase;
    const startSurf = surfaceAt(x, y);
    if (club.putt) {
      // power is the length (m) the putt would roll on the green
      const v = Math.sqrt(2 * SURF.green.roll * power);
      vx = v * ux; vy = v * uy; vz = 0; spin = 0; phase = "roll";
    } else {
      // a full swing from sand or rough loses some speed and spin
      const lieLoss = startSurf === "sand" ? 0.78 : startSurf === "rough" ? 0.9 : 1;
      const v = club.speed * power * lieLoss;
      const la = (club.launch * Math.PI) / 180;
      vx = v * Math.cos(la) * ux; vy = v * Math.cos(la) * uy; vz = v * Math.sin(la);
      spin = club.spin * power * (startSurf === "rough" ? 0.6 : startSurf === "sand" ? 0.8 : 1);
      phase = "air";
    }
    const dt = 0.004;
    let carry = null, apex = 0, result = null, lastDry = { x, y };
    const push = () => out.samples.push([+t.toFixed(3), +x.toFixed(2), +y.toFixed(2), +z.toFixed(2)]);
    push();
    let k = 0;
    while (t < 40) {
      k++;
      if (phase === "air") {
        const v = Math.hypot(vx, vy, vz);
        const w = (spin * 2 * Math.PI) / 60;
        const S = (R * w) / Math.max(v, 1);
        const cd = 0.21 + 0.25 * S;
        const cl = Math.min(0.3, 0.11 + 1.0 * S) * (spin > 50 ? 1 : 0);
        const q = (0.5 * RHO * AREA * v) / MASS;
        // lift is perpendicular to the velocity, in the vertical plane of flight (pure backspin)
        const vh = Math.hypot(vx, vy) || 1e-6;
        const lx = (-vz * vx) / vh, ly = (-vz * vy) / vh, lz = vh;
        const ax = -q * cd * vx + q * cl * lx;
        const ay = -q * cd * vy + q * cl * ly;
        const az = -G - q * cd * vz + q * cl * lz;
        vx += ax * dt; vy += ay * dt; vz += az * dt;
        x += vx * dt; y += vy * dt; z += vz * dt; t += dt;
        spin *= Math.exp(-dt / 25);
        apex = Math.max(apex, z);
        const tree = treeAt(x, y, z);
        if (tree) {
          // clipped by branches: most of the speed is lost and the ball falls
          out.marks.push({ type: "tree", x, y, z });
          const dx = x - tree.x, dy = y - tree.y, d = Math.hypot(dx, dy) || 1;
          vx = (dx / d) * 1.5 + vx * 0.08; vy = (dy / d) * 1.5 + vy * 0.08; vz = Math.min(vz, 0) * 0.3;
          spin = 0;
          x += (dx / d) * 0.3; y += (dy / d) * 0.3;
          result = result || "Hit the tree";
        }
        if (z <= 0) {
          z = 0;
          const s = surfaceAt(x, y);
          if (carry === null) carry = { x, y, d: Math.hypot(x - start.x, y - start.y) };
          out.marks.push({ type: "bounce", x, y, s });
          if (s === "water" || s === "ob") { phase = s; break; }
          lastDry = { x, y };
          const sf = SURF[s];
          let keep = sf.keep;
          if (s === "green" || s === "fringe" || s === "fairway" || s === "tee") keep -= 0.5 * Math.min(1, spin / 7000) * Math.min(1, -vz / 15);
          vx *= keep; vy *= keep; vz = -vz * sf.e;
          spin *= 0.4;
          if (vz < 1.2) { vz = 0; phase = "roll"; }
        }
      } else if (phase === "roll") {
        const s = surfaceAt(x, y);
        if (s === "water" || s === "ob") { phase = s; break; }
        lastDry = { x, y };
        const v = Math.hypot(vx, vy);
        // into the cup: close enough and slow enough to drop
        if (course.cup && Math.hypot(x - course.cup.x, y - course.cup.y) < CUP && v < 1.6) { x = course.cup.x; y = course.cup.y; phase = "holed"; break; }
        const a = SURF[s].roll;
        if (v <= a * dt) { vx = vy = 0; phase = "rest"; break; }
        vx -= (vx / v) * a * dt; vy -= (vy / v) * a * dt;
        x += vx * dt; y += vy * dt; t += dt;
      }
      if (k % 5 === 0) push();
    }
    push();
    const surf = phase === "holed" ? "green" : surfaceAt(x, y);
    out.rest = { x, y, surface: surf, lie: SURF[surf].name };
    out.carry = carry ? carry.d : 0;
    out.carryAt = carry;
    out.total = Math.hypot(x - start.x, y - start.y);
    out.apex = apex;
    out.duration = t;
    out.outcome = phase === "holed" ? "holed" : phase === "water" ? "water" : phase === "ob" ? "ob" : "rest";
    out.lastDry = lastDry;
    out.note = result;
    return out;
  }
  return { CLUBS, SURF, surfaceAt, lieOf, shot, treeAt };
}

function tick(now) {

    const u = b[0] > a[0] ? Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0]))) : 0;
    const p = [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, a[3] + (b[3] - a[3]) * u];
    placeBall({ x: p[0], y: p[1] }, p[2]);
    gShadow.setAttribute("transform", translateAlong(P, [p[0], p[1], 0]));
    const pts = s.samples.slice(0, i + 1).filter((_, k2) => k2 % 2 === 0).map((q2) => [q2[1], q2[2], q2[3] + 0.3]);
    pts.push([p[0], p[1], p[2] + 0.3]);
    gTrace.children[1].setAttribute("d", d2(pts));
    insetTrace = pts.map((q2) => [q2[0], q2[1]]);
    gTrace.children[0].setAttribute("d", d2(pts.map((q2) => [q2[0], q2[1], 0.12])));
    const d = dist({ x: p[0], y: p[1] }, anim.from);
    const text = golf.CLUBS[club].name + " · " + Math.round(d) + " m · height " + Math.round(p[2]) + " m";
    if (readout.textContent !== text) readout.textContent = text;
    if (t >= s.duration) {
      const s2 = anim.s, f = anim.from; anim = null;

new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible && anim) run(); }, { rootMargin: "120px 0px" }).observe(stage);
// ---- input ----
clubBtns.forEach((b) => b.addEventListener("click", () => { selectClub(b.getAttribute("data-club")); if (isPutt()) { suggestPower(); syncPower(); drawAim(); } }));
power.addEventListener("input", () => { syncPower(); drawAim(); });
hitBtn.addEventListener("click", hit);
$("[data-act=pin]").addEventListener("click", () => { heading = headingTo(cup); drawAim(); });
$("[data-act=left]").addEventListener("click", () => { heading -= Math.PI / 180; drawAim(); });
$("[data-act=right]").addEventListener("click", () => { heading += Math.PI / 180; drawAim(); });
placeBtn.addEventListener("click", () => { placing = !placing; placeBtn.setAttribute("aria-pressed", String(placing)); document.body.classList.toggle("gf-placing", placing); status(placing ? "Click the course to put the ball there" : ""); });
$("[data-act=reset]").addEventListener("click", () => {
  if (busy) return;
  ball = { ...tee }; strokes = 0; shotN = 0; holed = false; practice = false; gHist.innerHTML = ""; gTrace.innerHTML = ""; gMarks.innerHTML = ""; logEl.innerHTML = "";
  heading = headingTo(FAIRWAY_AIM); placeBall(ball); selectClub("driver"); status();
});
stage.addEventListener("pointerdown", (e) => {
  if (busy) return;
  stage.focus({ preventScroll: true });
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const s = pt.matrixTransform(svg.getScreenCTM().inverse());
  const g = ground(s.x, s.y);

  if (placing) {
    if (surf === "ob" || surf === "water") { status("You can't place the ball " + (surf === "ob" ? "off the course" : "in the water")); return; }
    ball = g; holed = false; placing = false; practice = true; placeBtn.setAttribute("aria-pressed", "false"); document.body.classList.remove("gf-placing");
    placeBall(ball); heading = headingTo(cup); selectClub(suggestClub()); suggestPower(); syncPower(); drawAim(); status("Ball placed (practice)");
    return;
  }

stage.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); heading += ((e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 5 : 1) * Math.PI) / 180; drawAim(); }
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); hit(); }
  if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); power.value = +power.value + (e.key === "ArrowUp" ? 1 : -1) * (+power.step || 1) * (isPutt() ? 1 : 2); syncPower(); drawAim(); }
});
placeBall(ball); selectClub("driver"); status();
